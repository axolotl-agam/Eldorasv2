name: Build EldorasCore

on:
  push:
    branches: [main]
    paths:
      - 'plugins/EldorasCore/**'
      - '.github/workflows/build-eldorascore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build plugin JAR
        working-directory: plugins/EldorasCore
        run: gradle clean build
      - uses: actions/upload-artifact@v4
        with:
          name: EldorasCore-JAR
          path: plugins/EldorasCore/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
