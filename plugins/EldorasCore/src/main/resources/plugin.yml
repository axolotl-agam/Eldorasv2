name: EldorasCore
version: '0.1.0-SNAPSHOT'
main: com.eldoras.core.EldorasCore
api-version: '1.21.4'
author: Eldoras
description: Core MMORPG systems for Eldoras V2
commands:
  eldoras:
    description: EldorasCore administration and status
    usage: /eldoras
    permission: eldoras.admin
  level:
    description: Oyuncunun MMORPG seviyesini ve EXP durumunu gösterir
    usage: /level
  class:
    description: MMORPG sınıfını görüntüler veya seçer
    usage: /class [choose <sınıf>]
  skills:
    description: Yetenek puanlarını ve öğrenilen yetenekleri gösterir
    usage: /skills [learn <yetenek>]
permissions:
  eldoras.admin:
    default: op
